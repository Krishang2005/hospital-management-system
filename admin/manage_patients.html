<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Patients - Admin Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" id="admin-nav"></nav>

<div class="container py-5 main-content" id="admin-content" style="display:none;">
    <h2 class="fw-bold mb-4">Manage Patients</h2>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 px-4">Patient Name</th>
                            <th class="py-3">Email Address</th>
                            <th class="py-3">Phone Number</th>
                            <th class="py-3">Last Treated By</th>
                            <th class="py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patients-tbody">
                        <tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-3 mt-auto text-center">
    <div class="container small">&copy; <span id="year"></span> KCG Multispecialist Hospital Admin Portal.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/admin.js"></script>
<script src="../js/script.js?v=4"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function deletePatient(id) {
        if (!confirm('Are you sure you want to delete this patient? All their appointments will also be deleted. This action cannot be undone.')) return;
        try {
            const res = await fetch('../api/admin/manage_patients.php', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ patient_id: id })
            });
            const result = await res.json();
            if (result.status === 'success') {
                showToast('Deleted', result.message);
                loadPatients();
            } else {
                showToast('Error', result.message, 'error');
            }
        } catch(e) {
            showToast('Error', 'Network error', 'error');
        }
    }

    async function loadPatients() {
        const tbody = document.getElementById('patients-tbody');
        const res = await fetch('../api/admin/manage_patients.php');
        const result = await res.json();
        
        if (result.status === 'success') {
            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">No patients found.</td></tr>';
                return;
            }

            let html = '';
            result.data.forEach(p => {
                const date = new Date(p.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                
                let statusBadge = '';
                if (p.last_status) {
                    let badgeClass = 'bg-secondary';
                    if (p.last_status === 'Completed') badgeClass = 'bg-success';
                    if (p.last_status === 'Ongoing')   badgeClass = 'bg-primary';
                    if (p.last_status === 'No-Show')   badgeClass = 'bg-dark';
                    if (p.last_status === 'Cancelled') badgeClass = 'bg-danger';
                    if (p.last_status === 'Pending')   badgeClass = 'bg-warning text-dark';
                    statusBadge = `<br><span class="badge ${badgeClass} rounded-pill mt-1" style="font-size: 0.7rem;">${p.last_status}</span>`;
                }

                html += `
                <tr>
                    <td class="px-4">
                        <div class="fw-semibold">${p.name}</div>
                        <small class="text-muted"><i class="fa-regular fa-calendar-plus me-1"></i> Reg: ${date}</small>
                    </td>
                    <td><a href="mailto:${p.email}" class="text-decoration-none">${p.email}</a></td>
                    <td>${p.phone}</td>
                    <td>
                        ${p.last_doctor ? `<div class="fw-medium text-success"><i class="fa-solid fa-user-doctor me-1"></i>Dr. ${p.last_doctor}</div>` : '<span class="text-muted small">No treatment yet</span>'}
                        ${statusBadge}
                    </td>
                    <td class="text-center">
                        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="deletePatient(${p.id})">
                            <i class="fa-solid fa-trash-can me-1"></i> Delete
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        } else {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load patients</td></tr>';
        }
    }

    async function init() {
        const session = await AppAuth.requireLogin(true);
        if(!session) return;
        
        AdminApp.renderAdminNavbar();
        document.getElementById('admin-content').style.display = 'block';
        loadPatients();
    }

    init();
</script>
</body>
</html>
