<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KCG Multispecialist Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; }
        .login-card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
        .form-control { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); color: #fff; }
        .form-control:focus { background: rgba(255,255,255,0.12); border-color: #6366f1; color: #fff; box-shadow: none; }
        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .form-label { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-hospital-user fa-3x text-indigo-400 mb-3" style="color:#818cf8;"></i>
                <h2 class="fw-bold text-white">KCG Multispecialist Hospital</h2>
                <p class="text-muted">Administrator Portal</p>
            </div>
            <div class="card login-card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <h4 class="text-center mb-4 fw-bold text-white"><i class="fa-solid fa-lock me-2"></i>Admin Login</h4>
                    <div id="error-msg" class="alert alert-danger d-none"></div>
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Admin Email</label>
                            <input type="email" id="email" class="form-control" placeholder="admin@hospital.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill" id="loginBtn" style="background:#6366f1;border-color:#6366f1;">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Secure Login
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="../index.html" class="text-decoration-none" style="color:rgba(255,255,255,0.5);font-size:0.875rem;">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Website
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js?v=4"></script>
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('error-msg');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Authenticating...';
        btn.disabled = true;

        const res = await AppAuth.login(
            document.getElementById('email').value,
            document.getElementById('password').value,
            true
        );

        if (res.status === 'success' && res.data.role === 'admin') {
            window.location.href = _BASE_URL + 'admin/admin_dashboard.html';
        } else {
            err.textContent = res.message || 'Access Denied. Admins only.';
            err.classList.remove('d-none');
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Secure Login';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
