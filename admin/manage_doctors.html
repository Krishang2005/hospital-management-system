<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors - Admin Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 1055;"></div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" id="admin-nav"></nav>

<div class="container py-5 main-content" id="admin-content" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Manage Doctors</h2>
        <button class="btn btn-primary rounded-pill shadow-sm px-4" data-bs-toggle="modal" data-bs-target="#addDocModal">
            <i class="fa-solid fa-plus me-2"></i> Add Doctor
        </button>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 px-4">Doctor</th>
                            <th class="py-3">Specialization</th>
                            <th class="py-3">Hospital & Exp.</th>
                            <th class="py-3">Status</th>
                            <th class="py-3">Slots (Ex: 10:00 AM)</th>
                            <th class="py-3 text-end px-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="doctors-tbody">
                        <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add Doctor Modal -->
<div class="modal fade" id="addDocModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title fw-bold">Add New Doctor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pb-4">
        <form id="addDocForm" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Doctor Name</label>
                    <input type="text" name="doctor_name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Specialization</label>
                    <input type="text" name="specialization" class="form-control" placeholder="Cardiologist" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Experience (Years)</label>
                    <input type="number" name="experience" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Qualification</label>
                    <input type="text" name="qualification" class="form-control" placeholder="MBBS, MD" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Hospital Name</label>
                    <input type="text" name="hospital" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Available Days</label>
                    <input type="text" name="available_days" class="form-control" placeholder="Mon, Wed, Fri" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Available Time Slots (Comma Separated)</label>
                    <input type="text" name="available_time" class="form-control" placeholder="10:00 AM, 10:30 AM, 11:00 AM" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Doctor Photo</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">
                </div>
            </div>
            <div class="mt-4 text-end">
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary rounded-pill px-4" id="saveDocBtn">Save Doctor</button>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white py-3 mt-auto text-center">
    <div class="container small">&copy; <span id="year"></span> KCG Multispecialist Hospital Admin Portal.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js?v=4"></script>
<script src="../js/app.js?v=3"></script>
<script src="../js/admin.js"></script>
<script src="../js/script.js"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const addModal = new bootstrap.Modal(document.getElementById('addDocModal'));

    async function loadDoctors() {
        const tbody = document.getElementById('doctors-tbody');
        const res = await fetch('../api/admin/manage_doctors.php');
        const result = await res.json();
        
        if (result.status === 'success') {
            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">No doctors found.</td></tr>';
                return;
            }

            let html = '';
            result.data.forEach(doc => {
                const initials = App.getDoctorInitials(doc.doctor_name);
                const photoHtml = (doc.photo && !doc.photo.includes('default'))
                    ? `<img src="../images/${doc.photo}" class="rounded-circle me-3 object-fit-cover shadow-sm" style="width: 45px; height: 45px;" onerror="this.outerHTML='<div class=\'doctor-avatar-sm\'>${initials}</div>';">`
                    : `<div class="doctor-avatar-sm">${initials}</div>`;

                html += `
                <tr>
                    <td class="px-4">
                        <div class="d-flex align-items-center">
                            ${photoHtml}
                            <div><h6 class="mb-0 fw-bold">Dr. ${doc.doctor_name}</h6></div>
                        </div>
                    </td>
                    <td>${doc.specialization}</td>
                    <td><small class="mb-0 text-muted">${doc.hospital}</small><br><strong>${doc.experience} Years</strong></td>
                    <td>
                        <button class="btn btn-sm ${doc.status === 'Available' ? 'btn-success' : 'btn-danger'} rounded-pill px-3" onclick="toggleStatus(${doc.id}, '${doc.status}')">
                            ${doc.status === 'Available' ? 'Available' : 'Unavailable'}
                        </button>
                    </td>
                    <td><small class="text-muted text-wrap" style="max-width:200px;display:block;">${doc.available_time}</small></td>
                    <td class="text-end px-4">
                        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteDoc(${doc.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        } else {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load doctors</td></tr>';
        }
    }

    async function toggleStatus(id, currentStatus) {
        const newStatus = currentStatus === 'Available' ? 'Busy' : 'Available';
        const res = await fetch('../api/admin/manage_doctors.php', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status: newStatus })
        });
        const result = await res.json();
        
        if (result.status === 'success') {
            showToast('Success', 'Doctor availability updated');
            loadDoctors();
        } else {
            showToast('Error', result.message, 'error');
        }
    }

    async function deleteDoc(id) {
        if(!confirm("Are you sure you want to delete this doctor?")) return;
        
        const res = await fetch('../api/admin/manage_doctors.php', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({id})
        });
        const result = await res.json();
        
        if(result.status === 'success') {
            showToast('Success', 'Doctor deleted');
            loadDoctors();
        } else {
            showToast('Error', result.message, 'error');
        }
    }

    document.getElementById('addDocForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveDocBtn');
        btn.disabled = true; btn.innerHTML = 'Saving...';
        
        const form = document.getElementById('addDocForm');
        const formData = new FormData(form);

        try {
            const res = await fetch('../api/admin/manage_doctors.php', {
                method: 'POST',
                body: formData // DO NOT SET CONTENT TYPE when sending FormData, browser handles boundary
            });
            
            const result = await res.json();
            
            if (result.status === 'success') {
                showToast('Success', 'Doctor added successfully');
                form.reset();
                addModal.hide();
                loadDoctors();
            } else {
                showToast('Error', result.message, 'error');
            }
        } catch (e) {
            showToast('Error', 'Upload failed. Check console.', 'error');
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerHTML = 'Save Doctor';
        }
    });

    async function init() {
        const session = await AppAuth.requireLogin(true);
        if(!session) return;
        
        AdminApp.renderAdminNavbar();
        document.getElementById('admin-content').style.display = 'block';
        loadDoctors();
    }

    init();
</script>
</body>
</html>
