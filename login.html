<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KCG Multispecialist Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-tab-btn {
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 28px;
            border-radius: 50px;
            transition: all 0.25s ease;
            color: #6b7280;
        }
        .login-tab-btn.active {
            background: #0d6efd;
            color: #fff;
            box-shadow: 0 4px 14px rgba(13,110,253,0.3);
        }
        .login-tab-btn.admin-active {
            background: #212529;
            color: #fff;
            box-shadow: 0 4px 14px rgba(33,37,41,0.3);
        }
        .tab-switcher {
            background: #f0f4f8;
            border-radius: 50px;
            padding: 4px;
            display: inline-flex;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .admin-header { color: #212529; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-hospital me-2"></i>KCG Multispecialist Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
      </ul>
      <ul class="navbar-nav ms-auto" id="nav-right"></ul>
    </div>
  </div>
</nav>

<div class="main-content container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 animate-scale-in">
                <div class="card-body p-4">

                    <!-- Tab Switcher -->
                    <div class="text-center mb-4">
                        <div class="tab-switcher">
                            <button class="login-tab-btn active" id="patientTabBtn" onclick="switchTab('patient')">
                                <i class="fa-solid fa-user me-1"></i> Patient
                            </button>
                            <button class="login-tab-btn" id="adminTabBtn" onclick="switchTab('admin')">
                                <i class="fa-solid fa-user-shield me-1"></i> Admin
                            </button>
                        </div>
                    </div>

                    <!-- Patient Login Panel -->
                    <div class="panel active" id="patientPanel">
                        <h3 class="text-center mb-4 fw-bold text-primary">Patient Login</h3>
                        <div id="patient-error" class="alert alert-danger d-none"></div>
                        <form id="patientLoginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="p-email" class="form-control" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="p-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="patientLoginBtn">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Login as Patient
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="register.html" class="text-decoration-none">Register here</a></p>
                        </div>
                    </div>

                    <!-- Admin Login Panel -->
                    <div class="panel" id="adminPanel">
                        <h3 class="text-center mb-4 fw-bold admin-header">
                            <i class="fa-solid fa-user-shield me-2 text-dark"></i>Admin Login
                        </h3>
                        <div id="admin-error" class="alert alert-danger d-none"></div>
                        <form id="adminLoginForm">
                            <div class="mb-3">
                                <label class="form-label">Admin Email</label>
                                <input type="email" id="a-email" class="form-control" placeholder="admin@hospital.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="a-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2" id="adminLoginBtn">
                                <i class="fa-solid fa-lock me-2"></i>Secure Admin Login
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        &copy; <span id="year"></span> KCG Multispecialist Hospital. All Rights Reserved.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=4"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    // DO NOT call redirectIfLoggedIn() here — it causes an infinite loop
    AppAuth.updateNavbar();

    function switchTab(tab) {
        const patientPanel = document.getElementById('patientPanel');
        const adminPanel = document.getElementById('adminPanel');
        const patientBtn = document.getElementById('patientTabBtn');
        const adminBtn = document.getElementById('adminTabBtn');

        if (tab === 'patient') {
            patientPanel.classList.add('active');
            adminPanel.classList.remove('active');
            patientBtn.classList.add('active');
            adminBtn.classList.remove('active', 'admin-active');
        } else {
            adminPanel.classList.add('active');
            patientPanel.classList.remove('active');
            adminBtn.classList.add('admin-active');
            patientBtn.classList.remove('active', 'admin-active');
        }
    }

    // Patient login
    document.getElementById('patientLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('patientLoginBtn');
        const errorMsg = document.getElementById('patient-error');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';
        btn.disabled = true;

        const res = await AppAuth.login(
            document.getElementById('p-email').value,
            document.getElementById('p-password').value
        );

        if (res.status === 'success') {
            window.location.href = res.data.role === 'admin'
                ? _BASE_URL + 'admin/admin_dashboard.html'
                : _BASE_URL + 'dashboard.html';
        } else {
            errorMsg.textContent = res.message;
            errorMsg.classList.remove('d-none');
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login as Patient';
            btn.disabled = false;
        }
    });

    // Admin login (tab on same page)
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('adminLoginBtn');
        const errorMsg = document.getElementById('admin-error');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Authenticating...';
        btn.disabled = true;

        const res = await AppAuth.login(
            document.getElementById('a-email').value,
            document.getElementById('a-password').value,
            true
        );

        if (res.status === 'success' && res.data.role === 'admin') {
            window.location.href = _BASE_URL + 'admin/admin_dashboard.html';
        } else {
            errorMsg.textContent = res.message || 'Access denied. Admins only.';
            errorMsg.classList.remove('d-none');
            btn.innerHTML = '<i class="fa-solid fa-lock me-2"></i>Secure Admin Login';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
