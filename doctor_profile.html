<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - KCG Multispecialist Hospital</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-hospital me-2"></i>KCG Multispecialist Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
      </ul>
      <ul class="navbar-nav ms-auto" id="nav-right">
      </ul>
    </div>
  </div>
</nav>

<div class="main-content container py-5">
    <div id="profile-container" class="card shadow-sm border-0 rounded-4 overflow-hidden mb-5">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
        <div class="text-center mb-0">
            &copy; <span id="year"></span> KCG Multispecialist Hospital. All Rights Reserved.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/app.js?v=3"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    AppAuth.updateNavbar();

    async function loadDoctorDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        
        if (!docId) { window.location.href = 'doctors.html'; return; }

        const res = await fetch(`api/public/get_doctor_details.php?id=${docId}`);
        const result = await res.json();
        
        const container = document.getElementById('profile-container');

        if(result.status === 'success') {
            const doc = result.data;
            const badgeClass = doc.status === 'Available' ? 'badge-available' : 'badge-busy';
            
            const actionBtn = doc.status === 'Available' 
                ? `<a href="book_appointment.html?doctor_id=${doc.id}" class="btn btn-primary btn-lg rounded-pill px-5 shadow"><i class="fa-regular fa-calendar-plus me-2"></i> Book Appointment Now</a>`
                : `<button class="btn btn-secondary btn-lg rounded-pill px-5" disabled><i class="fa-regular fa-calendar-times me-2"></i> Currently Unavailable</button>`;

            const initials = App.getDoctorInitials(doc.doctor_name);
            const photoHtml = (doc.photo && !doc.photo.includes('default')) 
                ? `<img src="images/${doc.photo}?v=${Date.now()}" class="img-fluid w-100 h-100" style="object-fit: cover; min-height: 400px;" alt="Dr. ${doc.doctor_name}" onerror="this.outerHTML='<div class=\'doctor-avatar\' style=\'height:100%;min-height:400px;font-size:12rem;\'>${initials}</div>';">`
                : `<div class="doctor-avatar" style="height:100%;min-height:400px;font-size:12rem;">${initials}</div>`;

            container.innerHTML = `
            <div class="row g-0">
                <div class="col-md-4">
                    ${photoHtml}
                </div>
                <div class="col-md-8">
                    <div class="card-body p-5">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="fw-bold text-primary mb-0">Dr. ${doc.doctor_name}</h2>
                            <span class="badge ${badgeClass} fs-6 rounded-pill px-3 py-2">${doc.status}</span>
                        </div>
                        
                        <h5 class="text-muted mb-4">${doc.specialization}</h5>
                        
                        <div class="row mb-5">
                            <div class="col-sm-6 mb-3">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-graduation-cap fs-4 text-primary me-3"></i>
                                    <div>
                                        <h6 class="mb-0 text-muted">Qualification</h6>
                                        <strong>${doc.qualification}</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-briefcase fs-4 text-primary me-3"></i>
                                    <div>
                                        <h6 class="mb-0 text-muted">Experience</h6>
                                        <strong>${doc.experience} Years</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-hospital fs-4 text-primary me-3"></i>
                                    <div>
                                        <h6 class="mb-0 text-muted">Hospital</h6>
                                        <strong>${doc.hospital}</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <div class="d-flex align-items-center">
                                    <i class="fa-regular fa-calendar-check fs-4 text-primary me-3"></i>
                                    <div>
                                        <h6 class="mb-0 text-muted">Available Days</h6>
                                        <strong>${doc.available_days}</strong>
                                    </div>
                                </div>
                            </div>
                        </div>

                        ${actionBtn}
                    </div>
                </div>
            </div>`;
        } else {
            container.innerHTML = '<div class="text-center py-5 text-danger fw-bold">Doctor not found. <a href="doctors.html">Click here to go back</a></div>';
        }
    }

    loadDoctorDetails();
</script>
</body>
</html>
