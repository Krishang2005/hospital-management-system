<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - KCG Multispecialist Hospital</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 1055;"></div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-hospital me-2"></i>KCG Multispecialist Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
      </ul>
      <ul class="navbar-nav ms-auto" id="nav-right"></ul>
    </div>
  </div>
</nav>

<div class="main-content container mt-5" id="profile-wrapper" style="display:none;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-5">
                    <h3 class="mb-4 fw-bold text-primary"><i class="fa-solid fa-user-gear me-2"></i> Profile Settings</h3>
                    
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Full Name</label>
                            <input type="text" class="form-control bg-light" id="name" readonly>
                            <div class="form-text">Name cannot be changed.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Email Address</label>
                            <input type="email" class="form-control bg-light" id="email" readonly>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>

                        <hr class="mb-4 text-muted">
                        <h5 class="mb-3 fw-bold">Change Password</h5>

                        <div class="mb-4">
                            <label class="form-label text-muted fw-semibold">New Password <small class="text-secondary">(leave blank to keep current password)</small></label>
                            <input type="password" class="form-control" id="new_password" name="new_password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill shadow-sm" id="saveBtn">Save Profile Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
        <div class="text-center mb-0">&copy; <span id="year"></span> KCG Multispecialist Hospital. All Rights Reserved.</div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/script.js"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    async function loadProfile() {
        const session = await AppAuth.requireLogin();
        if(!session) return;
        AppAuth.updateNavbar();
        
        document.getElementById('profile-wrapper').style.display = 'block';

        const res = await fetch('api/patient/update_profile.php');
        const result = await res.json();
        
        if (result.status === 'success') {
            document.getElementById('name').value = result.data.name;
            document.getElementById('email').value = result.data.email;
            document.getElementById('phone').value = result.data.phone;
        }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = 'Saving...';

        const phone = document.getElementById('phone').value;
        const new_password = document.getElementById('new_password').value;

        try {
            const res = await fetch('api/patient/update_profile.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, new_password })
            });
            const result = await res.json();

            if (result.status === 'success') {
                showToast('Success', result.message);
                document.getElementById('new_password').value = '';
            } else {
                showToast('Error', result.message, 'error');
            }
        } catch(err) {
            showToast('Error', 'Network error', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Save Profile Changes';
        }
    });

    loadProfile();
</script>
</body>
</html>
