<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - KCG Multispecialist Hospital</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Toast Notification Container -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 1055;"></div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-hospital me-2"></i>KCG Multispecialist Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
      </ul>
      <ul class="navbar-nav ms-auto" id="nav-right">
      </ul>
    </div>
  </div>
</nav>

<div class="main-content container py-5 animate-fade-in" id="appts-wrapper" style="display:none;">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h3 class="fw-bold mb-0">My Appointments</h3>
        <a href="doctors.html" class="btn btn-primary rounded-pill"><i class="fa-solid fa-plus me-2"></i> Book New</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 px-4">Date & Time</th>
                            <th class="py-3">Doctor</th>
                            <th class="py-3">Hospital</th>
                            <th class="py-3 text-center">Status</th>
                            <th class="py-3 text-end px-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="appts-tbody">
                        <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Cancel Modal -->
<div class="modal fade" id="cancelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold">Cancel Appointment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to cancel this appointment?</p>
        <p class="text-danger small mb-0"><i class="fa-solid fa-triangle-exclamation me-1"></i> This action cannot be undone.</p>
      </div>
      <div class="modal-footer border-top-0 pt-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Keep It</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmCancelBtn">Yes, Cancel It</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
        <div class="text-center mb-0">
            &copy; <span id="year"></span> KCG Multispecialist Hospital. All Rights Reserved.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/script.js"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    let cancelApptId = null;
    const cancelModal = new bootstrap.Modal(document.getElementById('cancelModal'));

    function openCancelModal(id) {
        cancelApptId = id;
        cancelModal.show();
    }

    async function loadAppointments() {
        const session = await AppAuth.requireLogin();
        if(!session) return;
        AppAuth.updateNavbar();

        document.getElementById('appts-wrapper').style.display = 'block';

        const tbody = document.getElementById('appts-tbody');
        const res = await fetch('api/patient/get_appointments.php');
        const result = await res.json();

        if (result.status === 'success') {
            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">You have no booked appointments yet.</td></tr>';
                return;
            }

            let html = '';
            result.data.forEach(appt => {
                let statusBadge = '';
                let actionBtn = '';
                
                if(appt.status === 'Pending') {
                    statusBadge = '<span class="badge bg-warning text-dark rounded-pill px-3 py-2"><i class="fa-regular fa-clock me-1"></i> Pending</span>';
                    actionBtn = `<button class="btn btn-sm btn-outline-danger rounded-pill" onclick="openCancelModal(${appt.id})">Cancel</button>`;
                } else if(appt.status === 'Confirmed') {
                    statusBadge = '<span class="badge bg-success rounded-pill px-3 py-2"><i class="fa-solid fa-check me-1"></i> Confirmed</span>';
                    actionBtn = `<button class="btn btn-sm btn-outline-danger rounded-pill" onclick="openCancelModal(${appt.id})">Cancel</button>`;
                } else if(appt.status === 'Completed') {
                    statusBadge = '<span class="badge bg-info rounded-pill px-3 py-2"><i class="fa-solid fa-check-double me-1"></i> Completed</span>';
                    actionBtn = `<button class="btn btn-sm btn-secondary rounded-pill disabled">Done</button>`;
                } else {
                    statusBadge = '<span class="badge bg-danger rounded-pill px-3 py-2"><i class="fa-solid fa-xmark me-1"></i> Cancelled</span>';
                    actionBtn = `<button class="btn btn-sm btn-secondary rounded-pill disabled" disabled>Cancelled</button>`;
                }

                const dDate = new Date(appt.appointment_date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                html += `
                <tr>
                    <td class="px-4"><strong>${dDate}</strong><br><small class="text-muted">${appt.appointment_time}</small></td>
                    <td><div class="d-flex align-items-center">
                        <div class="rounded-circle bg-light text-primary d-flex align-items-center justify-content-center me-3" style="width:40px;height:40px;"><i class="fa-solid fa-user-md"></i></div>
                        <div><h6 class="mb-0 fw-bold">Dr. ${appt.doctor_name}</h6><small class="text-muted">${appt.specialization}</small></div>
                    </div></td>
                    <td class="text-muted">${appt.hospital}</td>
                    <td class="text-center">${statusBadge}</td>
                    <td class="text-end px-4">${actionBtn}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-danger">Error loading appointments.</td></tr>';
        }
    }

    document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
        if (!cancelApptId) return;
        
        const btn = document.getElementById('confirmCancelBtn');
        btn.disabled = true;
        btn.innerHTML = 'Cancelling...';

        try {
            const res = await fetch('api/patient/cancel_appointment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: cancelApptId })
            });
            const result = await res.json();
            
            if (result.status === 'success') {
                showToast('Success', 'Appointment cancelled successfully.');
                cancelModal.hide();
                loadAppointments();
            } else {
                showToast('Error', result.message, 'error');
            }
        } catch (e) {
            showToast('Error', 'Network error', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Yes, Cancel It';
        }
    });

    loadAppointments();
</script>
</body>
</html>
