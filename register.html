<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - KCG Multispecialist Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-hospital me-2"></i>KCG Multispecialist Hospital</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
      </ul>
      <ul class="navbar-nav ms-auto" id="nav-right">
      </ul>
    </div>
  </div>
</nav>

<div class="main-content container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 fw-bold text-primary">Patient Registration</h3>
                    
                    <div id="msg-box" class="alert d-none"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="regBtn">Register</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>Already have an account? <a href="login.html" class="text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
        <div class="text-center mb-0">
            &copy; <span id="year"></span> KCG Multispecialist Hospital. All Rights Reserved.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js?v=4"></script>
<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    AppAuth.redirectIfLoggedIn();
    AppAuth.updateNavbar();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('regBtn');
        const msgBox = document.getElementById('msg-box');
        
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Registering...';
        btn.disabled = true;
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        
        const res = await AppAuth.register(name, email, phone, password);
        
        msgBox.className = 'alert';
        msgBox.classList.remove('d-none');
        
        if (res.status === 'success') {
            msgBox.classList.add('alert-success');
            msgBox.textContent = res.message;
            document.getElementById('registerForm').reset();
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
            msgBox.classList.add('alert-danger');
            msgBox.textContent = res.message;
        }
        
        btn.innerHTML = 'Register';
        btn.disabled = false;
    });
</script>
</body>
</html>
